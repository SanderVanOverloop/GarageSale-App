<main class="min-h-screen flex items-center justify-center bg-[#FEF3E2] p-0 sm:p-2">
  <div class="w-full max-w-none md:max-w-[99vw] lg:max-w-[98vw] xl:max-w-[97vw] 2xl:max-w-[1800px] bg-white border-2 border-[#FAB12F] rounded-2xl shadow-lg p-1 sm:p-8 flex flex-col md:flex-row gap-4 md:gap-10">
    <div class="flex-1 flex flex-col gap-6 min-w-0 pt-2 md:pt-6" style="justify-content: flex-start;">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-[#DD0303] text-center md:text-left tracking-tight mb-2">Garage Sale Address Mapper</h1>
      <div class="flex flex-col gap-2">
        <label for="startPointInput" class="text-[#FA812F] font-semibold">Starting Point Address</label>
        <input type="text" id="startPointInput" placeholder="e.g. 1 randomstraat, hasselt, 3500, Belgium"
          class="w-full px-3 sm:px-4 py-2 border-2 border-[#FAB12F] rounded-lg bg-[#FEF3E2] text-[#DD0303] placeholder-[#FAB12F] focus:outline-none focus:ring-2 focus:ring-[#FA812F] transition text-sm sm:text-base" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="csvFileInput" class="text-[#FA812F] font-semibold">Upload CSV File</label>
        <input type="file" id="csvFileInput" accept=".csv"
          class="w-full px-2 sm:px-3 py-2 border-2 border-[#FAB12F] rounded-lg bg-[#FEF3E2] text-[#DD0303] cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#FA812F] transition text-sm sm:text-base" />
      </div>
      <button id="showRouteBtn"
        class="w-full bg-[#DD0303] hover:bg-[#FA812F] text-white font-bold py-2 px-4 rounded-lg shadow transition text-base sm:text-lg">Show Route on Map</button>
      <div id="routeOverview" class="mt-4 bg-[#FAB12F]/10 rounded-xl p-3 sm:p-4 shadow-inner text-[#DD0303] min-h-[40px] sm:min-h-[48px] text-sm sm:text-base"></div>
    </div>
    <div class="flex-1 flex flex-col justify-center min-w-0">
      <div id="map" class="w-full h-[300px] sm:h-[400px] md:h-[600px] lg:h-[700px] xl:h-[800px] 2xl:h-[900px] rounded-xl shadow border-2 border-[#FAB12F] mt-2"></div>
    </div>
  </div>
</main>
