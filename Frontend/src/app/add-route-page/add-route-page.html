<main class="min-h-screen flex items-center justify-center bg-[#FEF3E2] p-4">
  <div class="w-full max-w-lg bg-white border-2 border-[#FAB12F] rounded-2xl shadow-lg p-8 flex flex-col gap-6">
    <h1 class="text-3xl font-extrabold text-[#DD0303] text-center tracking-tight mb-2">Garage Sale Address Mapper</h1>
    <div class="flex flex-col gap-2">
      <label for="startPointInput" class="text-[#FA812F] font-semibold">Starting Point Address</label>
      <input type="text" id="startPointInput" placeholder="e.g. 1 randomstraat, hasselt, 3500, Belgium"
        class="w-full px-4 py-2 border-2 border-[#FAB12F] rounded-lg bg-[#FEF3E2] text-[#DD0303] placeholder-[#FAB12F] focus:outline-none focus:ring-2 focus:ring-[#FA812F] transition" />
    </div>
    <div class="flex flex-col gap-2">
      <label for="csvFileInput" class="text-[#FA812F] font-semibold">Upload CSV File</label>
      <input type="file" id="csvFileInput" accept=".csv"
        class="w-full px-3 py-2 border-2 border-[#FAB12F] rounded-lg bg-[#FEF3E2] text-[#DD0303] cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#FA812F] transition" />
    </div>
    <button id="showRouteBtn"
      class="w-full bg-[#DD0303] hover:bg-[#FA812F] text-white font-bold py-2 px-4 rounded-lg shadow transition">Show Route on Map</button>
    <div id="map" class="w-full rounded-xl shadow border-2 border-[#FAB12F] mt-2" style="height: 400px;"></div>
    <div id="routeOverview" class="mt-4 bg-[#FAB12F]/10 rounded-xl p-4 shadow-inner text-[#DD0303] min-h-[48px]"></div>
  </div>
</main>
